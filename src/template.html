<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fishyTasks</title>
    <link rel="icon" type="image/x-icon" href="img/fish.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet&display=swap" rel="stylesheet">
</head>
<body>
    <div class="content">
        <div class="header">
            <img src="img/fish.png" alt="icon of a fish in water with some sea grass in the background" class="header-icon" />

            <h1>fishyTasks</h1>
        </div>

        <div class="sidebar">
            <button type="button" class="new-task-btn" command="show-modal" commandfor="new-task">New Task</button>
            <button type="button" class="new-list-btn" command="show-modal" commandfor="new-list">New List</button>
            <!-- <button type="button" class="all-lists-btn">All Lists</button> -->

            <div class="other-sidebar-btns">
                <button type="button" class="list-btn default-btn">Default List</button>
            </div>
        </div>

        <div class="main-content">
            <div class="task-display"></div>
        </div>
    </div>

    <dialog id="new-task" class="new-task-dialog">
        <form action="" method="" class="new-task-form">
            <div class="new-task-header">
                <h2>New Task</h2>

                <div>
                    <button type="button" class="new-task-ok-btn">Ok</button>
                    <button type="button" commandfor="new-task" command="close">X</button>
                </div>
            </div>

            <div class="new-task-inputs">
                <div class="input-fields">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="todoTitle" class="todo-title" required />
                </div>

                <div class="input-fields">
                    <label for="description">Description:</label>
                    <textarea id="description" name="todoDesc" class="todo-desc" rows="5"></textarea>
                </div>

                <div class="input-fields">
                    <label for="dueDate">Due Date:</label>
                    <input type="date" id="dueDate" name="todoDate" class="todo-date" />
                </div>
            
                <fieldset>
                    <legend>Task Priority</legend>

                    <div>
                        <input type="radio" id="urgent" name="priority" value="urgent" class="task-priority" checked />
                        <label for="urgent">Urgent</label>
                    </div>

                    <div>
                        <input type="radio" id="important" name="priority" value="important" class="task-priority" />
                        <label for="important">Important</label>
                    </div>

                    <div>
                        <input type="radio" id="casual" name="priority" value="casual" class="task-priority" />
                        <label for="casual">Casual</label>
                    </div>
                </fieldset>
            </div>
        </form>
    </dialog>

    <dialog id="edit-task" class="edit-task-dialog">
        <form action="" method="" class="edit-task-form">
            <div class="edit-task-header">
                <h2>Edit Task</h2>

                <div>
                    <button type="button" class="edit-task-ok-btn">Ok</button>
                    <button type="button" commandfor="edit-task" command="close">X</button>
                </div>
            </div>

            <div class="edit-task-inputs">
                <div class="input-fields">
                    <label for="editTitle">Title:</label>
                    <input type="text" id="editTitle" name="edit-todoTitle" class="edit-todo-title" required />
                </div>

                <div class="input-fields">
                    <label for="editDescription">Description:</label>
                    <textarea id="editDescription" name="edit-todoDesc" class="edit-todo-desc" rows="5"></textarea>
                </div>

                <div class="input-fields">
                    <label for="editDueDate">Due Date:</label>
                    <input type="date" id="editDueDate" name="edit-todoDate" class="edit-todo-date" />
                </div>
            </div>
        </form>
    </dialog>

    <dialog id="new-list" class="new-list-dialog">
        <form action="" method="" class="new-list-form">
            <div class="new-list-header">
                <h2>New Todo List</h2>

                <div>
                    <button type="button" class="new-list-ok-btn">Ok</button>
                    <button type="button" commandfor="new-list" command="close">X</button>
                </div>
            </div>

            <div class="new-list-inputs">
                <div class="input-fields">
                    <label for="name">List Name:</label>
                    <input type="text" id="name" name="todoListName" class="list-name" required />
                </div>
            </div>
        </form>
    </dialog>
</body>
</html>
